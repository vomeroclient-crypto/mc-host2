world-border: 10000

# ── Download schematics from a website ───────────────────────────────────────
# /fetchschematics [url]  downloads into plugins/DonutSMPWorld/schematics/ and registers them.
# A URL can be a direct .litematic link, a .zip of .litematic files, or a text file with one URL per line.
# With no url given, /fetchschematics uses this list. Set fetch-schematics-on-startup to true to auto-download on boot.
schematic-sources: []
#  - "https://example.com/schematics/all.zip"
fetch-schematics-on-startup: false

# When a schematic is placed, delete everything inside its box that is NOT part of the schematic
# (terrain, ores, water, lava, trees...). Set to false to keep natural blocks in the empty parts.
clear-terrain-inside: true

# No mobs spawn inside placed schematics (their boxes are saved in schematic-zones.txt). Mobs already inside are removed
# when the schematic is placed. Eggs, spawn commands, breeding and golem/wither builds still work.
no-mob-spawn-in-schematics: true

# Rename step for downloaded files. Each rule is "downloaded name -> new name" (case-insensitive, .litematic optional).
# "Base (1).litematic"-style duplicate suffixes are stripped automatically, and spaces/odd characters become "_".
# Rename to an existing built-in file name (e.g. Bastion_Base_Stash) to replace that schematic with the download.
schematic-renames: []
#  - "Cool Base v2 -> cool_base"
#  - "mega stash (final) -> Bastion_Base_Stash"

# Renames made with /renameschematic are saved here automatically (what you type in /placeschematic).
key-renames: []

# Players keep their whole inventory when they die
keep-inventory-on-death: true

# After dying, teleport to a random safe spot in the overworld (like /rtp)
random-respawn: true

# Performance tuning
performance:
  rtp-cooldown-seconds: 15            # stops /rtp spam from generating chunks nonstop
  max-runtime-activity-zones: 30      # stop tracking/spawning geodes after this many zones
# Seed this server's world should use (the plugin warns on startup if it doesn't match)
world-seed: -3868604108235547403

# ── Base discoverability ─────────────────────────────────────────────────────
# Applies to bases placed from now on (existing bases are not moved).
base-finding:
  distance-multiplier: 0.35   # 1.0 = original (bases 500-9000 blocks out). 0.35 = about a third of that.
  raise-bases: 25             # lift every base this many blocks closer to the surface (0 = original depth)
  size-depth-penalty: false   # true = big bases sink extra deep (harder)
  decoys: false               # true = fake rooms, fake ores and fake geodes around hard bases
  esp-shimmer: false          # true = random "ghost blocks" on the outer shell
  stone-cap: false            # true = stone/deepslate cap over hard bases
  land-only: true             # only place bases under dry land (skips oceans and rivers), read from the real terrain
  # Pin a base to an exact spot, e.g. one you picked on a seed map (Chunkbase). Format "x,y,z".
  # Keys: drdonut, greek, ice, lacchez, dils, regear, purplex, redafk, gambling,
  #       bastion, coliseum, sandstone, voidview, voidxmas, cathedral, casino, mud
  fixed-locations: {}
  #  drdonut: "1200,-30,-800"

# ── Spacing between bases / stashes / farms / schematics ─────────────────────
# New placements keep at least min-gap blocks (edge to edge, on the XZ plane) from every existing base, stash,
# farm and schematic. If an area is too crowded the placer retries with 2/3 then 1/3 of the gap, then skips it.
# /removebase [preview] [minGap] deletes existing placements that are closer than this to an older one
# (farms and hand-placed bases are never deleted).
base-spacing:
  enabled: true
  min-gap: 150

removebase:
  blocks-per-tick: 20000      # how fast /removebase wipes blocks (lower = less lag, slower)

base-count: 8
stash-count: 20
geode-count: 15

# How deep underground to build bases (Y level)
base-depth: -30

# Activity simulation - geodes spawn near "active" areas
activity-radius: 500
geodes-per-activity-zone: 3

# Base types to generate (all enabled by default)
base-types:
  media-base: true      # Big flashy base like a YouTuber
  baltop-base: true     # Rich player hoarding base  
  nomad-stash: true     # Small hidden stash
  main-base: true       # Normal player main base
  trap-base: true       # Looks good, fully trapped
  regear-base: true     # Regear base schematic (28x14x14)
  purplex-base: true    # Purplex Purple Radioactive Base (84x37x67, extra hidden)

# Loot tiers
loot:
  nomad:
    - IRON_SWORD:1
    - IRON_PICKAXE:1
    - BREAD:16
    - IRON_INGOT:8
    - COAL:32
  main:
