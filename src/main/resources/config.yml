    - DIAMOND_SWORD:1
    - ENCHANTED_BOOK:2
    - GOLDEN_APPLE:3
    - OBSIDIAN:16
    - IRON_INGOT:32
  baltop:
    - DIAMOND:32
    - DIAMOND_BLOCK:5
    - NETHERITE_SCRAP:3
    - GOLDEN_APPLE:16
    - ENCHANTED_BOOK:5
    - ELYTRA:1
  media:
