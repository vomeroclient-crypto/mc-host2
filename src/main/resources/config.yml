# ─────────────────────────────────────────────────────────────────────────────
# ANTICHEAT TUNING
# Bigger bases are harder to find because:
#   1. ESP shimmer makes their outline appear/disappear 50% randomly per block
#   2. Concealment scales with footprint (more fake ores, wider scatter)
#   3. AC thresholds below are tightened for the checks that matter during raiding
#      (speed/flight for trident users, reach/killaura for combat at the base)
# Relog is NOT patched — it's the intended discovery method.
# ─────────────────────────────────────────────────────────────────────────────
anticheat:

  # Movement checks — tightened so trident/elytra abuse near bases flags faster
  movement:
    speed:
      max-horizontal-speed: 0.38       # vanilla sprint = 0.29, tight but not false-positive
      punishments:
        2: { action: WARN }
        4: { action: KICK }
        7: { action: BAN, duration: "7d", reason: "Movement Exploit" }
    flight:
      max-air-time-ticks: 30           # vanilla fall = ~20 ticks, elytra/fly hack trips at 30
      punishments:
        2: { action: WARN }
        4: { action: KICK }
        7: { action: BAN, duration: "7d", reason: "Fly Hack" }

  # Combat checks — tightened for base raiding scenarios
  combat:
    killaura:
      max-attack-angle: 60.0           # down from 70, legit swings stay under 60
      max-targets-per-second: 3        # aura hits 4+/sec, legit PvP rarely exceeds 2
      punishments:
        2: { action: WARN }
        4: { action: KICK }
        6: { action: BAN, duration: "14d", reason: "Unfair Advantage" }
    reach:
      max-reach-distance: 3.1          # vanilla = 3.0, slight buffer for lag
      punishments:
        2: { action: WARN }
        5: { action: KICK }
        8: { action: BAN, duration: "14d", reason: "Combat Range Exploit" }

  # World checks — mining near a big base involves a lot of block breaking;
  # these are kept reasonable to avoid false-positives from legit deepslate mining
  world:
    nuker:
      min-break-delay-ms: 55           # slightly tighter than default 60
      max-blocks-per-second: 10        # down from 12, still allows fast mining
      punishments:
        4: { action: WARN }
        7: { action: KICK }
        12: { action: BAN, duration: "3d", reason: "World Exploit" }
    fast-place:
      min-place-delay-ms: 45
      punishments:
        5: { action: WARN }
        9: { action: KICK }
        14: { action: BAN, duration: "1d", reason: "World Exploit" }

  inventory:
    fast-use:
      min-click-delay-ms: 85           # slightly tighter
      punishments:
        5: { action: WARN }
        9: { action: KICK }
        14: { action: BAN, duration: "1d", reason: "Inventory Exploit" }

# ─────────────────────────────────────────────────────────────────────────────
# STAFF WATCH SYSTEM
# Passively tracks suspicious player behaviour and alerts staff with
# donutsmp.staff permission. Mirrors what MotionClient's anti-vanish /
# "staff live" module detects on the client side — but on the server.
#
# Suspicion scoring:
#   • Fast relog (back within relog-window-seconds):         +3 pts
#   • Login within base-proximity-radius of a known base:   +5 pts
#   • Relog flood (3+ in 60 s):                             +4 pts
#   • Mining along chunk-border lines underground:           +2 pts (per 8 breaks)
#   • 60+ blocks straight underground (tunnel trace):        +2 pts
#   • Dying with 500+ XP dropped (looted someone rich):     +3 pts
#   • Manual /staffwatch flag:                              +15 pts
#
# When score >= flag-score-threshold:
#   - All online staff get a chat alert
#   - Player's nametag turns dark red in staff tab
#   - Periodic location pings sent to all online staff
#
# /staffwatch list              — see all flagged players
# /staffwatch goto <name>       — teleport (spectator) to player
# /staffwatch flag <name>       — manually flag a player
# /staffwatch clear <name>      — wipe their record
# ─────────────────────────────────────────────────────────────────────────────
staff-watch:
  relog-window-seconds: 30       # relog within N seconds = suspicious
  relog-count-threshold: 3       # 3+ relogs in 60 s = relog flood
  flag-score-threshold: 10       # score needed to alert staff
  base-proximity-radius: 60      # blocks from a known base to count login as "near base"
  alert-interval-seconds: 60     # how often to re-ping staff with flagged player locations
